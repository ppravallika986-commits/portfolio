<!-- =========================
     CONTACT
========================= -->

<section class="contact" id="contact">

    <div class="section-title">

        <h2>
            Contact <span>Me</span>
        </h2>

        <p>
            Let's connect
        </p>

    </div>


    <div class="contact-container">


        <div class="contact-info">

            <h3>
                Get In Touch
            </h3>

            <p>
                I am open to internship opportunities,
                projects, collaborations and learning
                opportunities.
            </p>


            <!-- EMAIL -->

            <div class="contact-item">

                <div class="contact-icon">
                    ✉
                </div>

                <div>

                    <strong>
                        Email
                    </strong>

                    <a href="mailto:ppravalika986@gmail.com">
                        ppravalika986@gmail.com
                    </a>

                </div>

            </div>


            <!-- LOCATION -->

            <div class="contact-item">

                <div class="contact-icon">
                    📍
                </div>

                <div>

                    <strong>
                        Location
                    </strong>

                    Guntur, Andhra Pradesh, India

                </div>

            </div>


            <!-- GITHUB -->

            <div class="contact-item">

                <div class="contact-icon">
                    💻
                </div>

                <div>

                    <strong>
                        GitHub
                    </strong>

                    <a
                        href="https://github.com/ppravalika986"
                        target="_blank"
                        rel="noopener noreferrer">

                        github.com/ppravalika986

                    </a>

                </div>

            </div>

        </div>


        <!-- CONTACT FORM -->

        <div class="contact-form">

            <input
                type="text"
                placeholder="Your Name"
                required
            >

            <input
                type="email"
                placeholder="Your Email"
                required
            >

            <input
                type="text"
                placeholder="Subject"
            >

            <textarea
                placeholder="Your Message">
            </textarea>

            <button
                class="submit-btn"
                onclick="sendMessage()">

                Send Message

            </button>

        </div>

    </div>

</section>
